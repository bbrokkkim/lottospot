spring.application.name=lotto

# -----------------------------------------------------------------------
# DataSource
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lottospot?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:12341234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# schema.sql 초기화 (ddl-auto=validate 와 함께 사용)
spring.sql.init.mode=never

# -----------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# -----------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# -----------------------------------------------------------------------
# CORS (프로덕션에서 CORS_ALLOWED_ORIGINS 환경변수로 설정)
# -----------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://frontend-8hkj0l0mg-kkkims-projects.vercel.app}
