name: Weekly Data Update

on:
  schedule:
    - cron: '0 22 * * 6'  # 매주 토요일 밤 22:00 (UTC+9 = 일요일 07:00 KST)
  workflow_dispatch:        # 수동 실행 버튼도 제공

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install requests pymysql python-dotenv
        shell: powershell

      - name: Get latest round in DB
        id: get_round
        run: |
          $round = python crawler/get_latest_round.py
          echo "start_round=$round" >> $env:GITHUB_OUTPUT
        shell: powershell
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: lottospot

      - name: Crawl new winning history
        run: python crawler/crawl_win_history.py --start ${{ steps.get_round.outputs.start_round }}
        shell: powershell
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: lottospot
